name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r control_plane/requirements.txt
      - name: Navegador do teste de cookie
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Testes
        run: python -m pytest tests

  powershell:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Teclado e portas do Compose
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arquivo in @('iniciar_servicos.ps1', 'scripts\teclado_janela.ps1', 'scripts\portas_compose.ps1', 'scripts\boot_scout.ps1', 'scripts\keeper_boot.ps1', 'scripts\testar_teclado.ps1', 'tests\diag_cookie_tunel.ps1', 'tests\testar_desligamento_sem_console.ps1', 'tests\factory_reset_logs.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $arquivo), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors -and @($parseErrors).Count -gt 0) {
              Write-Error ($parseErrors | Out-String)
              exit 1
            }
          }
          & powershell.exe -NoProfile -File scripts\testar_teclado.ps1 -SomenteTamanho
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -File tests\testar_desligamento_sem_console.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -File tests\factory_reset_logs.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . .\scripts\portas_compose.ps1
          . .\scripts\teclado_janela.ps1
          function Get-EnvValue {
            param($Key, $Default)
            if ($Key -eq 'SCOUT_PUBLIC_PORT') { return '8501' }
            if ($Key -eq 'PAINEL_BORDA_PORT') { return '8501' }
            return $Default
          }
          Set-PortasDoCompose
          if ($env:SCOUT_PUBLIC_PORT -ne '4050') { throw "SCOUT_PUBLIC_PORT=$env:SCOUT_PUBLIC_PORT" }
          if ($env:PAINEL_BORDA_PORT -ne '8502') { throw "PAINEL_BORDA_PORT=$env:PAINEL_BORDA_PORT" }
          Initialize-TecladoJanela
          function Read-TeclaFallback {
            $script:TecladoModo = 'fallback'
            $script:FallbackRodou = $true
            return 0
          }
          $script:TecladoJanelaEstado = 'ok'
          $script:HandleTeclado = [IntPtr]1
          $script:FallbackRodou = $false
          [void](Read-TeclaJanela)
          if (-not $script:FallbackRodou) { throw 'leitura vazia nao caiu no fallback' }
          if ($script:TecladoModo -ne 'fallback') { throw "modo=$script:TecladoModo" }
          . .\scripts\boot_scout.ps1
          $porta = Get-PortaScoutEfetiva
          if ($porta -ne '4050') { throw "porta=$porta" }
          $plano = Plano-NgrokAposScout -UsarScout $true -ScoutNoAr $false
          if ($plano.Subir) { throw 'ngrok apontou para o scout caido' }
          $saude = Resultado-SubidaScout -CodigoUp 0 -SaudeOk $false
          if ($saude.NoAr) { throw 'saude falha ficou no ar' }
          $texto = Texto-BootNucleo -UsarScout $true -ScoutNoAr $false -Motivo $saude.Motivo -Porta $porta -Stacks @()
          if ($texto -match 'Nucleo no ar') { throw $texto }
          $hud = Texto-HudScout -ScoutNoAr $false -Motivo $saude.Motivo -Porta $porta
          if ($hud -notmatch '4050' -or $hud -match 'ACTIVO') { throw $hud }
          $parado = Estado-ScoutNoLoop -ContainerNoAr $false -SaudeOk $false
          if ($parado.NoAr -or $parado.Motivo -notmatch 'container scout-backend parado') { throw $parado.Motivo }
          $semSaude = Estado-ScoutNoLoop -ContainerNoAr $true -SaudeOk $false
          if ($semSaude.NoAr -or $semSaude.Motivo -notmatch '8765') { throw $semSaude.Motivo }
          $vivo = Estado-ScoutNoLoop -ContainerNoAr $true -SaudeOk $true
          if (-not $vivo.NoAr -or $vivo.Motivo) { throw 'scout no ar' }
          $hudLoop = Texto-HudScout -ScoutNoAr $parado.NoAr -Motivo $parado.Motivo -Porta $porta
          if ($hudLoop -match 'ACTIVO' -or $hudLoop -notmatch 'Scout fora do ar') { throw $hudLoop }
          $aviso = Completar-Ngrok -Codigo 3
          if ($aviso -notmatch 'Control Plane continua') { throw $aviso }
          . .\scripts\keeper_boot.ps1
          $raizKeeper = Join-Path $env:TEMP ("n8g-keeper-" + [guid]::NewGuid().ToString("n"))
          $keeperProc = $null
          $outroProc = $null
          try {
            Ensure-ChaveMaquina -Raiz $raizKeeper
            $chaveMaq = Join-Path $raizKeeper ".n8groker\maquina.key"
            if (-not (Test-Path -LiteralPath $chaveMaq)) { throw "maquina.key nao nasceu" }
            if ((Get-Item -LiteralPath $chaveMaq).Length -ne 32) { throw "tamanho da maquina.key" }
            $antesMaq = [System.IO.File]::ReadAllBytes($chaveMaq)
            Ensure-ChaveMaquina -Raiz $raizKeeper
            $depoisMaq = [System.IO.File]::ReadAllBytes($chaveMaq)
            if (@(Compare-Object $antesMaq $depoisMaq).Count -gt 0) { throw "maquina.key foi reescrita" }
            $envPath = Join-Path $raizKeeper ".env"
            [System.IO.File]::WriteAllText($envPath, "SCOUT_NGROK_TUNNEL_URL=https://exemplo.ngrok.app`n")
            $envAntes = [System.IO.File]::ReadAllText($envPath)
            Ensure-ChaveMaquina -Raiz $raizKeeper
            if ([System.IO.File]::ReadAllText($envPath) -ne $envAntes) { throw ".env mudou" }
            $shellKeeper = "powershell.exe"
            $keeperProc = Start-Process -FilePath $shellKeeper -ArgumentList "-NoProfile","-Command","Start-Sleep -Seconds 90; 'control_plane.keeper'" -PassThru -WindowStyle Hidden
            $outroProc = Start-Process -FilePath $shellKeeper -ArgumentList "-NoProfile","-Command","Start-Sleep -Seconds 90" -PassThru -WindowStyle Hidden
            $linhaKeeper = ""
            for ($espera = 0; $espera -lt 30; $espera++) {
              $linhaKeeper = Get-LinhaDeComandoKeeper -ProcessId $keeperProc.Id
              if ($linhaKeeper -and $linhaKeeper.ToLowerInvariant().Contains("control_plane.keeper")) { break }
              Start-Sleep -Milliseconds 200
            }
            if (-not $linhaKeeper -or -not $linhaKeeper.ToLowerInvariant().Contains("control_plane.keeper")) {
              throw "linha do keeper: $linhaKeeper"
            }
            $pidKeeper = Join-Path $raizKeeper ".n8groker\keeper.pid"
            Set-Content -LiteralPath $pidKeeper -Value $keeperProc.Id -Encoding ASCII
            Stop-KeeperSeVivo -Raiz $raizKeeper
            if (Get-Process -Id $keeperProc.Id -ErrorAction SilentlyContinue) { throw "keeper pid sobreviveu" }
            if (-not (Get-Process -Id $outroProc.Id -ErrorAction SilentlyContinue)) { throw "processo alheio foi morto" }
            Set-Content -LiteralPath $pidKeeper -Value $outroProc.Id -Encoding ASCII
            Stop-KeeperSeVivo -Raiz $raizKeeper
            if (-not (Get-Process -Id $outroProc.Id -ErrorAction SilentlyContinue)) { throw "pid sem a linha do keeper foi morto" }
          } finally {
            if ($keeperProc) { Stop-Process -Id $keeperProc.Id -Force -ErrorAction SilentlyContinue }
            if ($outroProc) { Stop-Process -Id $outroProc.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $raizKeeper) { Remove-Item -LiteralPath $raizKeeper -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Write-Host 'Teclado SizeOf=20, lote com Q, portas 4050/8502 e Scout fora sem derrubar o painel.'
      - name: Cache do PSScriptAnalyzer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .psscriptanalyzer-cache
          key: psscriptanalyzer-1.25.0-${{ runner.os }}
      - name: Parser e ScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path (Get-Location) 'iniciar_servicos.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors -and @($parseErrors).Count -gt 0) {
            Write-Error ($parseErrors | Out-String)
            exit 1
          }

          function Test-GaleriaPSGallery {
            try {
              $repo = Get-PSRepository -Name PSGallery -ErrorAction Stop
              return [bool]$repo
            } catch {
              return $false
            }
          }

          function Invoke-ComRetentativa {
            param(
              [Parameter(Mandatory = $true)][scriptblock]$Acao,
              [Parameter(Mandatory = $true)][string]$OQue,
              [int]$Tentativas = 3
            )
            $ultimo = ''
            for ($n = 1; $n -le $Tentativas; $n++) {
              try {
                & $Acao
                return
              } catch {
                $ultimo = $_.Exception.Message
                Write-Host "$OQue : tentativa $n de $Tentativas falhou. $ultimo"
                if ($n -lt $Tentativas) {
                  Start-Sleep -Seconds (5 * $n)
                }
              }
            }
            Write-Error "$OQue falhou depois de $Tentativas tentativas. A analise do PSScriptAnalyzer nao foi executada. Ultimo erro: $ultimo"
            exit 1
          }

          function Test-Analyzer1250 {
            $mods = @(Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq [version]'1.25.0' })
            return ($mods.Count -gt 0)
          }

          $cacheDir = Join-Path (Get-Location) '.psscriptanalyzer-cache'
          if (Test-Path -LiteralPath $cacheDir) {
            $env:PSModulePath = "$cacheDir$([IO.Path]::PathSeparator)$env:PSModulePath"
          }

          $carregado = $false
          if (Test-Analyzer1250) {
            try {
              Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
              $carregado = $true
              Write-Host 'PSScriptAnalyzer 1.25.0 carregado do cache.'
            } catch {
              Write-Host "O cache do PSScriptAnalyzer nao carregou. A instalacao vai repetir. $($_.Exception.Message)"
              $partes = @($env:PSModulePath -split [IO.Path]::PathSeparator | Where-Object { $_ -and ($_ -ne $cacheDir) })
              $env:PSModulePath = $partes -join [IO.Path]::PathSeparator
            }
          }

          if (-not $carregado) {
            if (Test-GaleriaPSGallery) {
              Write-Host 'PSGallery ja registrada. Nao chama Register-PSRepository.'
            } else {
              Invoke-ComRetentativa -OQue 'Register-PSRepository -Default' -Acao {
                if (-not (Test-GaleriaPSGallery)) {
                  Register-PSRepository -Default -ErrorAction Stop
                }
              }
            }
            if (-not (Test-GaleriaPSGallery)) {
              Write-Error 'A PSGallery nao ficou registrada depois do Register-PSRepository -Default. A analise do PSScriptAnalyzer nao foi executada.'
              exit 1
            }
            try {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
            } catch {
              Write-Error "Nao foi possivel marcar a PSGallery como confiavel. A analise do PSScriptAnalyzer nao foi executada. $($_.Exception.Message)"
              exit 1
            }
            Invoke-ComRetentativa -OQue 'Install-Module PSScriptAnalyzer 1.25.0' -Acao {
              if (-not (Test-Analyzer1250)) {
                Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
              }
            }
            if (-not (Test-Analyzer1250)) {
              Write-Error 'O PSScriptAnalyzer 1.25.0 nao ficou instalado. A analise nao foi executada.'
              exit 1
            }
            try {
              Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -ErrorAction Stop
            } catch {
              Write-Error "O PSScriptAnalyzer 1.25.0 foi instalado, mas nao carregou. A analise nao foi executada. $($_.Exception.Message)"
              exit 1
            }
            try {
              $origem = (Get-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0).ModuleBase
              $destino = Join-Path $cacheDir 'PSScriptAnalyzer\1.25.0'
              New-Item -ItemType Directory -Path (Split-Path -Parent $destino) -Force | Out-Null
              if (Test-Path -LiteralPath $destino) {
                Remove-Item -LiteralPath $destino -Recurse -Force
              }
              Copy-Item -LiteralPath $origem -Destination $destino -Recurse -Force
              Write-Host "PSScriptAnalyzer 1.25.0 instalado e gravado no cache em $destino"
            } catch {
              Write-Host "PSScriptAnalyzer 1.25.0 instalado. O cache nao foi gravado, e a analise segue. $($_.Exception.Message)"
            }
          }

          $findings = @(Invoke-ScriptAnalyzer -Path $path -Severity Error)
          if ($findings.Count -gt 0) {
            Write-Error ($findings | Format-List | Out-String)
            exit 1
          }
          Write-Host 'Parser e ScriptAnalyzer (somente Error) sem achados.'
