# Proxy LiteLLM do N8Groker.
# Não cadastre providers, modelos nem chaves de LLM aqui.
# Isso é feito na UI (http://localhost:4000/ui), com o banco habilitado abaixo.
# O callback envia cada chamada do proxy ao Langfuse na rede Docker (serviço langfuse-web).

model_list: []

general_settings:
  store_model_in_db: true

litellm_settings:
  callbacks: ["langfuse_otel"]
  drop_params: true
