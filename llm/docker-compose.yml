# Langfuse v4 + LiteLLM na rede externa `rede_comunicacao` (a mesma do n8n).
# De dentro dos containers os nomes são os serviços: langfuse-web, litellm, n8n_app.
#
# Imagens pinadas (não use :latest):
#   Langfuse 4.30.0 — docker.io/langfuse/langfuse e langfuse-worker
#     (o compose oficial usa a tag flutuante :4; aqui fica o patch 4.30.0)
#   ClickHouse 25.12.11, Postgres 17.11, Redis 7.4.11
#   MinIO: a tag pinada quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
#   devolve 401 (Quay e Docker Hub exigem login). Imagem pública usada pelo
#   compose atual do Langfuse: cgr.dev/chainguard/minio, digest fixo.
#   LiteLLM v1.103.1 — ghcr.io/berriai/litellm
#     (a doc de deploy pede tag fixa; o exemplo antigo v1.90.2 não é o stable atual)
#
# Portas no host, só em 127.0.0.1 (não batem com n8n 5678, Porteiro 5677, ngrok 4040, Scout 4050/8765):
#   3000  Langfuse UI
#   3030  health do worker
#   4000  LiteLLM (UI em /ui)
#   9090  MinIO para upload do browser
# Postgres, Redis e ClickHouse ficam só na rede Docker (ClickHouse nativo usa 9000
# dentro do container; não publicamos 9000 para não ocupar a porta de um Portainer).
#
# Segredos vêm do .env da raiz (gerados por scripts/init_env.py). Não há senha padrão.

name: n8groker-llm

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD_ausente}@langfuse-postgres:5432/${LANGFUSE_DB_NAME:-langfuse}
  SALT: ${SALT:?SALT_ausente}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY_ausente}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
  # Docker define HOSTNAME com o id do container. O Next usa isso e escuta só
  # nesse IP, então o healthcheck em 127.0.0.1 falha e o LiteLLM não sobe.
  # Web e worker herdam este âncora.
  HOSTNAME: "0.0.0.0"
  # Ingestão OTLP em tempo real no self-host (senão o trace pode atrasar).
  LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR: direct
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD_ausente}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD_ausente}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD_ausente}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
  LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
  LANGFUSE_S3_BATCH_EXPORT_REGION: auto
  LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-langfuse}
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD_ausente}
  LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?REDIS_AUTH_ausente}

services:
  langfuse-postgres:
    image: docker.io/postgres:17.11
    container_name: langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD_ausente}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - rede_comunicacao

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12.11
    container_name: langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      TZ: UTC
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD_ausente}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - rede_comunicacao

  langfuse-redis:
    image: docker.io/redis:7.4.11
    container_name: langfuse-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_AUTH:?REDIS_AUTH_ausente}
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?REDIS_AUTH_ausente}
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - rede_comunicacao

  langfuse-minio:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    container_name: langfuse-minio
    restart: unless-stopped
    # A imagem Chainguard não tem /bin/sh; o sh do PATH existe e foi o que subiu.
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/langfuse && exec minio server --address :9000 --console-address :9001 /data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD_ausente}
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - rede_comunicacao

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4.30.0
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on: &langfuse-deps
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      <<: *langfuse-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - rede_comunicacao

  langfuse-web:
    image: docker.io/langfuse/langfuse:4.30.0
    container_name: langfuse-web
    restart: unless-stopped
    depends_on: *langfuse-deps
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET_ausente}
      # Browser envia mídia direto ao MinIO publicado no host.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Headless init: organização, projeto, usuário e chaves que o LiteLLM usa.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-n8groker}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-N8Groker}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-n8groker}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-N8Groker}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY_ausente}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY_ausente}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?LANGFUSE_INIT_USER_PASSWORD_ausente}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - rede_comunicacao

  litellm-db:
    image: docker.io/postgres:17.11
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD_ausente}
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - rede_comunicacao

  litellm:
    image: ghcr.io/berriai/litellm:v1.103.1
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    depends_on:
      litellm-db:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD_ausente}@litellm-db:5432/${LITELLM_DB_NAME:-litellm}
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY_ausente}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY_ausente}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?LITELLM_UI_PASSWORD_ausente}
      # Mesmas chaves do headless init do Langfuse. Host interno, não o localhost do browser.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY_ausente}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY_ausente}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    extra_hosts:
      # Só para um modelo que você cadastrar depois na UI apontar ao host.
      # Nenhum host de modelo local nem chave de provider é definido aqui.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - rede_comunicacao

networks:
  rede_comunicacao:
    external: true
    name: rede_comunicacao

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
  litellm_postgres_data:
